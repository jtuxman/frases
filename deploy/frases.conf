# Frases en acción: HTTPS en el puerto 8443 -> servidor de Vite en 127.0.0.1:8000
# Usa el certificado de Let's Encrypt de galileo.ibt.unam.mx (lo renueva certbot).

map $http_upgrade $frases_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name galileo.ibt.unam.mx;

    ssl_certificate /etc/letsencrypt/live/galileo.ibt.unam.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/galileo.ibt.unam.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Si alguien entra con http:// a este puerto, lo manda a https://
    error_page 497 =301 https://$host:$server_port$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket para la recarga en vivo de Vite
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $frases_connection_upgrade;
    }
}
